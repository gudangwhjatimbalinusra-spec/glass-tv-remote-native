
name: Build Glass TV Remote APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check project files
        run: |
          test -f glass-tv-remote-native/android/settings.gradle
          test -f glass-tv-remote-native/android/app/build.gradle
          test -f glass-tv-remote-native/android/app/src/main/java/com/ismanto/glasstvremote/MainActivity.kt
          test -f glass-tv-remote-native/android/app/src/main/java/com/ismanto/glasstvremote/TvAdbBridge.kt
          test -f glass-tv-remote-native/www/index.html

      - name: Copy HTML into Android assets
        run: |
          mkdir -p glass-tv-remote-native/android/app/src/main/assets
          cp glass-tv-remote-native/www/index.html glass-tv-remote-native/android/app/src/main/assets/index.html

      - name: Build debug APK
        run: |
          gradle -p glass-tv-remote-native/android clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Remote-APK
          path: glass-tv-remote-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
