
name: Build Glass TV Remote Native APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37.0
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Fix Android 37 Platform Folder
        run: |
          cd "$ANDROID_HOME/platforms"
          if [ -d "android-37.0" ]; then
            ln -sfn android-37.0 android-37
          else
            echo "Folder android-37.0 tidak ditemukan"
            exit 1
          fi
          ls -la

      - name: Copy Web App Assets
        run: |
          mkdir -p glass-tv-remote-native/android/app/src/main/assets/www
          cp -r glass-tv-remote-native/www/* glass-tv-remote-native/android/app/src/main/assets/
          cp -r glass-tv-remote-native/www/* glass-tv-remote-native/android/app/src/main/assets/www/

      - name: Generate Gradle Wrapper
        working-directory: ./glass-tv-remote-native/android
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./glass-tv-remote-native/android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTVRemote-Debug-APK
          path: glass-tv-remote-native/android/app/build/outputs/apk/debug/app-debug.apk
