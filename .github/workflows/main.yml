
name: Build Glass TV Remote APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: ./glass-tv-remote-native
        run: npm install

      - name: Generate Android project
        working-directory: ./glass-tv-remote-native
        run: npx cap add android

      - name: Add JitPack and native ADB bridge
        working-directory: ./glass-tv-remote-native
        run: |
          # Tambahkan repository JitPack untuk dependency ADB
          cat >> android/build.gradle <<'EOF'

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

          # Salin plugin Kotlin ADB
          mkdir -p android/app/src/main/java/com/ismanto/glasstvremote

          cp native/android/app/src/main/java/com/ismanto/glasstvremote/*.kt \
          android/app/src/main/java/com/ismanto/glasstvremote/

          # Tambahkan library Kadb
          sed -i '/dependencies {/a\    implementation "com.flyfishxu:kadb:2.1.5"' \
          android/app/build.gradle

          # Izin jaringan
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' \
          android/app/src/main/AndroidManifest.xml

          sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' \
          android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        working-directory: ./glass-tv-remote-native
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./glass-tv-remote-native/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Remote-APK
          path: glass-tv-remote-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
