name: Build Glass TV Remote Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Clean Conflicting Kotlin Files
        run: |
          # Hapus folder java kustom agar tidak terjadi error compile Kotlin
          rm -rf glass-tv-remote-native/android/app/src/main/java/com/ismanto/glasstvremote/* || true
          
          PROPERTIES_FILE="glass-tv-remote-native/android/gradle.properties"
          echo "android.useAndroidX=true" > "$PROPERTIES_FILE"
          echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"

      - name: Copy www/index.html ke Android Assets
        run: |
          mkdir -p glass-tv-remote-native/android/app/src/main/assets/www
          cp -r glass-tv-remote-native/www/* glass-tv-remote-native/android/app/src/main/assets/
          cp -r glass-tv-remote-native/www/* glass-tv-remote-native/android/app/src/main/assets/www/

      - name: Build Debug APK
        working-directory: ./glass-tv-remote-native/android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTVRemote-Debug-APK
          path: glass-tv-remote-native/android/app/build/outputs/apk/debug/app-debug.apk
