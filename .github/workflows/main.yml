name: Build Glass TV Remote Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Copy www/index.html ke Android Assets
        run: |
          mkdir -p glass-tv-remote-native/android/app/src/main/assets/www
          cp -r glass-tv-remote-native/www/* glass-tv-remote-native/android/app/src/main/assets/
          cp -r glass-tv-remote-native/www/* glass-tv-remote-native/android/app/src/main/assets/www/

      - name: Build Debug APK dengan Gradle
        working-directory: ./glass-tv-remote-native/android
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTVRemote-Debug-APK
          path: glass-tv-remote-native/android/app/build/outputs/apk/debug/app-debug.apk
