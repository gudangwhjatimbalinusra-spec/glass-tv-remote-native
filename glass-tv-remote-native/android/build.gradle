plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ismanto.glasstvremote'
    compileSdk 37

    defaultConfig {
        applicationId 'com.ismanto.glasstvremote'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.flyfishxu:kadb:2.1.4'

    // Library untuk menjalankan suspend function Kadb.pair()
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
